services:
  postgres:
    image: postgres:16-alpine
    container_name: nipmed-postgres
    environment:
      POSTGRES_USER: nipmed
      POSTGRES_PASSWORD: nipmed
      POSTGRES_DB: nipmed
    ports:
      - "5432:5432"
    volumes:
      - nipmed_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nipmed -d nipmed"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nipmed-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nipmed-api
    env_file:
      - .env
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+asyncpg://nipmed:nipmed@postgres:5432/nipmed
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  nipmed_pg:
